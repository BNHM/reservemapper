<div ng-controller="QueryStatsController as queryStatsVm" style="padding:40px">
    <div class="help-block" ng-show="!queryStatsVm.queryResults.isSet">Click <strong>Search</strong> on sidebar to
        display stats results
    </div>

    <div ng-show="queryStatsVm.queryResults.isSet">
        <div ng-show="queryStatsVm.queryResults.querySource === 'gbif'">
            <label class="control-label">Total occurrence records = {{queryStatsVm.totalResults}}</label>
            <label class="control-label" ng-show="!queryStatsVm.queryResults.isCompleteRecordSet">
                Table sample = {{queryStatsVm.queryResults.size}} records
            </label>
        </div>
        <div ng-show="queryStatsVm.queryResults.querySource !== 'gbif'">
            <label class="control-label">Total results included = {{queryStatsVm.queryResults.toFetch}}
                {{queryStatsVm.totalResults=== queryStatsVm.queryResults.toFetch ? "": " out of " +queryStatsVm.totalResults + " possible"}}
            </label>
        </div>
        <div><label class="control-label">Group and Count by:</label></div>

        <button class="btn btn-default btn-sm" ng-click="institutionCount()">Institution Code</button>
        <button class="btn btn-default btn-sm" ng-click="collectionCodeCount()">Collection Code</button>
        <button class="btn btn-default btn-sm" ng-click="basisOfRecordCount()">Basis of Record</button>
        <button class="btn btn-default btn-sm" ng-click="yearCount()">Year</button>
        <button class="btn btn-default btn-sm" ng-click="kingdomCount()">Kingdom</button>
        <button class="btn btn-default btn-sm" ng-click="phylumCount()">Phylum</button>
        <button class="btn btn-default btn-sm" ng-click="speciesCount()">Species</button>
        <button class="btn btn-default btn-sm" ng-click="scientificNameCount()">Scientific Name</button>
        <button class="btn btn-default btn-sm" ng-click="localityCount()">Locality</button>
        <br></br>
        <div class="help-block" ng-show="queryStatsVm.loadingStats">Loading stats... {{queryStatsVm.statsProgress}}</div>
        <div grid-data grid-options="gridOptions" grid-actions="gridActions">
            <table class="table">
                <thead>
                    <tr>
                        <th sortable="value" class="sortable" width="50px">{{queryStatsVm.valueColumnName || 'count'}}</th>
                        <th sortable="key" class="sortable">{{queryStatsVm.columnName}}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr grid-item>
                        <td ng-bind-html="item.value"></td>
                        <td ng-bind-html="item.key"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
